[package]
name = "ps_remote"
version = "0.1.0"
edition = "2024"

[dependencies]
aes = "0.8"
base64 = "0.22"
bytes = "1"
cipher = "0.4"
hex = "0.4"
hmac = "0.12"
k256 = { version = "0.13", default-features = false, features = ["ecdh", "arithmetic", "alloc"] }
prost = "0.14"
rand = "0.10"
rustls = { version = "0.23", features = ["ring"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
socket2 = "0.6"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring", "tls12"] }
url = "2.5"
urlencoding = "2.1"
webpki-roots = "=0.26.11"
